<title>Kenneth Dajao</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:#161616;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:#161616;color:#fff;font-family:"Roboto","Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:#2a2a2a;border-radius:22px;overflow:hidden;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.top{position:relative;height:200px;background:#000}
.logo{position:absolute;left:50%;top:12px;height:158px;width:auto;transform:translateX(-50%);z-index:1}
.photo{display:block;width:200px;height:190px;object-fit:cover;position:relative;z-index:2;margin:-75px auto 0;border:3px solid #3d3d3d;border-radius:62% 38% 54% 46% / 48% 56% 44% 52%;background:#111}
h1{font-size:1.7rem;margin:18px 0 4px;letter-spacing:-.01em}
.role{margin:0;color:#b5b5b5;font-size:1.02rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 8px;padding:28px 18px 34px}
.item{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:#cfcfcf;font-size:.92rem}
.circle{width:58px;height:58px;border-radius:50%;background:#000;border:1px solid #4d4d4d;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.circle svg{width:25px;height:25px}
.item:active .circle,.item:hover .circle{background:#fff;color:#000}
.item:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:12px}
</style>
</head>
